name: Build Minecraft Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Klonirovanie repozitoriya
        uses: actions/checkout@v4

      - name: Raspakovka ishodnikov iz zip
        run: |
          if [ -f AdvancedPvPMod_Fixed2.zip ]; then
            unzip -o AdvancedPvPMod_Fixed2.zip -d .
          fi

      - name: Ustanovka JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Nastroika Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sborka moda
        run: gradle build

      - name: Sohranenie jar faila
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedPvPMod-1.21.4
          path: build/libs/*.jar
